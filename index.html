<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06C755">
  <title>LINE 1-20</title>

  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .hint{
     text-align: center;
     color: #777;
     margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: auto;
    }

    .line-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      border: 0;
      border-radius: 16px;
      background: #06C755;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 3px 8px rgba(0,0,0,.12);
    }

    .line-btn:active {
      transform: scale(.97);
    }
  </style>
</head>

<body>

  <h1>LINE 1-20</h1> 
  <div class="hint">選擇開啟的 LINE</div>

  <div class="grid" id="lineGrid"></div>

  <script>
    const grid = document.getElementById('lineGrid');

    for (let i = 1; i <= 20; i++) {
      const button = document.createElement('a');

      button.className = 'line-btn';
      button.textContent = 'LINE ' + i;

      button.href =
        'intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=jp.naver.line.android.clone' +
        i + ';end';

      grid.appendChild(button);
    }
  </script>

</body>
</html>
